
<svg
xmlns="http://www.w3.org/2000/svg"
width="300"
height="318"
viewBox="0 0 300 318"
>

<defs>

    <linearGradient
        id="gradient"
        x1="0%"
        y1="0%"
        x2="100%"
        y2="0%"
    >

        <animate
            attributeName="x1"
            values="-100%;100%;-100%"
            dur="8s"
            repeatCount="indefinite"
        />

        <animate
            attributeName="x2"
            values="0%;200%;0%"
            dur="8s"
            repeatCount="indefinite"
        />

        <stop offset="0%" stop-color="#00F5FF">
            <animate
                attributeName="stop-color"
                values="
                #00F5FF;
                #6A5CFF;
                #FF4FD8;
                #00FF9C;
                #00F5FF"
                dur="10s"
                repeatCount="indefinite"
            />
        </stop>

        <stop offset="100%" stop-color="#6A5CFF">
            <animate
                attributeName="stop-color"
                values="
                #6A5CFF;
                #FF4FD8;
                #00FF9C;
                #00F5FF;
                #6A5CFF"
                dur="10s"
                repeatCount="indefinite"
            />
        </stop>

    </linearGradient>

    <filter id="glow">

        <feGaussianBlur
            stdDeviation="2"
            result="blur"
        />

        <feMerge>
            <feMergeNode in="blur"/>
            <feMergeNode in="SourceGraphic"/>
        </feMerge>

    </filter>

</defs>

<!-- Background -->

<rect
    width="100%"
    height="100%"
    fill="#090B10"
/>

<!-- Terminal -->

<rect
    x="10"
    y="10"
    width="280"
    height="298"
    rx="12"
    fill="#161B22"
    stroke="#30363D"
/>

<!-- Window Controls -->

<circle
    cx="30"
    cy="30"
    r="6"
    fill="#FF5F56"
/>

<circle
    cx="50"
    cy="30"
    r="6"
    fill="#FFBD2E"
/>

<circle
    cx="70"
    cy="30"
    r="6"
    fill="#27C93F"
/>

<!-- Title -->

<text
    x="90"
    y="35"
    font-family="monospace"
    font-size="14"
    fill="#8B949E"
>
terminal://PlasCovid
</text>

<!-- ASCII -->

<text
    x="40"
    y="70"
    font-family="monospace"
    font-size="16"
    fill="url(#gradient)"
    filter="url(#glow)"
    xml:space="preserve"
>

<tspan
    x="40"
    dy="0"
>
@@@@@@@@@@@@@@@@@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@@@@@######@@@@@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@@@##******##@@@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@##**++++++**##@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@##**  OO  **##@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@##** ---- **##@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@##**********##@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@@@############@@@@@
</tspan>

<tspan
    x="40"
    dy="22"
>
@@@@@@@@@@@@@@@@@@@@@
</tspan>

</text>

</svg>
