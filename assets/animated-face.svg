

<svg
xmlns="http://www.w3.org/2000/svg"
width="980"
height="1124"
viewBox="0 0 980 1124"
>



<defs>

<linearGradient
id="asciiGradient"
x1="0%"
y1="0%"
x2="100%"
y2="0%"
>

<animate
attributeName="x1"
values="-100%;100%;-100%"
dur="12s"
repeatCount="indefinite"
/>

<animate
attributeName="x2"
values="0%;200%;0%"
dur="12s"
repeatCount="indefinite"
/>

<stop
offset="0%"
stop-color="#00F5FF"
>

<animate
attributeName="stop-color"
values="
#00F5FF;
#6A5CFF;
#FF4FD8;
#00FF9C;
#00F5FF"
dur="10s"
repeatCount="indefinite"
/>

</stop>

<stop
offset="100%"
stop-color="#6A5CFF"
>

<animate
attributeName="stop-color"
values="
#6A5CFF;
#FF4FD8;
#00FF9C;
#00F5FF;
#6A5CFF"
dur="10s"
repeatCount="indefinite"
/>

</stop>

</linearGradient>

<filter id="glow">

<feGaussianBlur
stdDeviation="2.2"
result="blur"
/>

<feMerge>

<feMergeNode in="blur"/>

<feMergeNode in="SourceGraphic"/>

</feMerge>

</filter>

</defs>





