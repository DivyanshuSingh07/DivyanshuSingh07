name: Update GitHub Profile

on:
  workflow_dispatch:

  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  update-profile:

    runs-on: ubuntu-latest

    steps:

      # -----------------------------
      # Checkout Repository
      # -----------------------------

      - name: Checkout Repository
        uses: actions/checkout@v4

      # -----------------------------
      # Setup Node
      # -----------------------------

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # -----------------------------
      # Install Dependencies
      # -----------------------------

      - name: Install Dependencies
        run: npm install

      # -----------------------------
      # Generate GitHub Stats
      # -----------------------------

      - name: Fetch GitHub Stats
        run: node scripts/fetchStats.js
        env:
            GITHUB_USERNAME: ${{ secrets.USERNAME }}
            GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}

      # -----------------------------
      # Generate ASCII Portrait
      # -----------------------------

      - name: Generate ASCII
        run: node scripts/convertToAscii.js

      # -----------------------------
      # Generate SVG
      # -----------------------------

      - name: Generate SVG
        run: node scripts/generateSvg.js

      # -----------------------------
      # Generate README
      # -----------------------------

      - name: Generate README
        run: node scripts/updateReadme.js

      # -----------------------------
      # Commit Changes
      # -----------------------------

      - name: Commit Changes

        run: |

          if git diff --quiet; then

            echo "No changes detected."

          else

            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

            git add .

            git commit -m "chore(profile): refresh GitHub profile"

            git push

          fi